<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Support</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; width: 100%; }

    .full-page-call {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      height: 100vh;
      width: 100%;
      background: #0a0a0a;
      color: #fff;
      text-decoration: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* ── Top half — banner ── */
    .banner {
      height: 50vh;
      width: 100%;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* ── Blinking icon sitting ON the banner/divider line ── */
    .pulse-wrap {
      position: absolute;
      top: 50vh;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    .pulse-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #1a7f3c;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: pulse 1.2s infinite;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .pulse-ring::before, .pulse-ring::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      border: 3px solid #1a7f3c;
      animation: ripple 1.8s infinite;
    }
    .pulse-ring::after { animation-delay: 0.9s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(26,127,60,0.6); }
      50% { transform: scale(1.06); box-shadow: 0 0 0 16px rgba(26,127,60,0); }
    }

    @keyframes ripple {
      0%   { width: 80px;  height: 80px;  opacity: 0.7; }
      100% { width: 180px; height: 180px; opacity: 0; }
    }

    .phone-icon { font-size: 34px; }

    /* ── Bottom half — call content ── */
    .content {
      height: 50vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 50px 20px 16px; /* top padding gives room for the overlapping icon */
      gap: 10px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .tap-hint {
      font-size: 13px;
      color: #1a7f3c;
      font-weight: 600;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .call-box {
      background: #1a7f3c;
      border-radius: 16px;
      padding: 14px 28px;
      box-shadow: 0 6px 24px rgba(26,127,60,0.5);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .call-box img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .call-info { display: flex; flex-direction: column; align-items: flex-start; }

    .call-box .label {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .call-box .number {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .footer-note {
      font-size: 11px;
      color: #333;
    }
  </style>
</head>
<body>

  <a class="full-page-call" href="tel:+18003459808">

    <!-- TOP HALF — banner -->
    <div class="banner">
      <img src="224.png" alt="Support Banner">
    </div>

    <!-- Blinking icon floating over the banner/content divider -->
    <div class="pulse-wrap">
      <div class="pulse-ring">
        <span class="phone-icon">📞</span>
      </div>
    </div>

    <!-- BOTTOM HALF — call content -->
    <div class="content">
      <h1>Talk to Support Now</h1>
      <p class="tap-hint">👆 TAP ANYWHERE TO CALL</p>

      <div class="call-box">
        <img src="223.png" alt="Logo">
        <div class="call-info">
          <div class="label">Toll Free</div>
          <div class="number">+1 800-345-9808</div>
        </div>
      </div>

      <p class="footer-note">Tap anywhere on this page to connect</p>
    </div>

  </a>

</body>
</html>
