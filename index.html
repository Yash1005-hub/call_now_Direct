<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to Support...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 50px 20px;
        }
        .call-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 20px 40px;
            font-size: 24px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.4);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #28a745;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="call-box">
        <div class="loader"></div>
        <h1>Connecting You to an Agent</h1>
        <p>Your dialer should open automatically. If not, click the button below:</p>
        
        <!-- THE TEL LINK -->
        <a href="tel:+18775136221" id="callButton" class="btn">CALL NOW</a>
        
        <p style="margin-top:20px; color:#666; font-size:14px;">
            Support is available 24/7. No hold music.
        </p>
    </div>

    <script>
        // Set the phone number here
        const phoneNumber = "tel:+18775136221";

        window.onload = function() {
            // Attempt to open the dialer after a 1-second delay
            setTimeout(function() {
                window.location.href = phoneNumber;
            }, 1000);
        };
    </script>

</body>
</html>
