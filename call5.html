<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Support</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    /* The entire page is the call link */
    html, body {
      height: 100%;
      width: 100%;
    }

    .full-page-call {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 100vh;
      width: 100%;
      background: #0a0a0a;
      color: #fff;
      text-decoration: none;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .pulse-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #1a7f3c;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      position: relative;
      animation: pulse 1.2s infinite;
    }

    .pulse-ring::before, .pulse-ring::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      border: 3px solid #1a7f3c;
      animation: ripple 1.8s infinite;
    }
    .pulse-ring::after { animation-delay: 0.9s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(26,127,60,0.5); }
      50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(26,127,60,0); }
    }

    @keyframes ripple {
      0%   { width: 130px; height: 130px; opacity: 0.6; }
      100% { width: 260px; height: 260px; opacity: 0; }
    }

    .phone-icon { font-size: 52px; }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #fff;
    }

    .subtitle {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 10px;
    }

    .tap-hint {
      font-size: 14px;
      color: #1a7f3c;
      font-weight: 600;
      margin-bottom: 40px;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .call-box {
      background: #1a7f3c;
      border-radius: 20px;
      padding: 24px 50px;
      box-shadow: 0 6px 30px rgba(26,127,60,0.5);
    }

    .call-box .label {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .call-box .number {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }

    .footer-note {
      position: fixed;
      bottom: 20px;
      font-size: 12px;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- Entire page is one big <a href="tel:"> link -->
  <a class="full-page-call" href="tel:+18003459808">

    <div class="pulse-ring">
      <span class="phone-icon">📞</span>
    </div>

    <h1>Talk to Support Now</h1>
    <p class="subtitle">Free consultation — no hold time</p>
    <p class="tap-hint">👆 TAP ANYWHERE TO CALL</p>

    <div class="call-box">
      <div class="label">Toll Free</div>
      <div class="number">+1 800-345-9808</div>
    </div>

  </a>

  <div class="footer-note">Tap anywhere on this page to connect</div>

</body>
</html>
