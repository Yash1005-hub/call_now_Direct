<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .pulse-ring {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #1a7f3c;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      position: relative;
      animation: pulse 1.5s infinite;
    }

    .pulse-ring::before, .pulse-ring::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      border: 2px solid #1a7f3c;
      animation: ripple 1.5s infinite;
    }
    .pulse-ring::after { animation-delay: 0.5s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes ripple {
      0% { width: 100px; height: 100px; opacity: 1; }
      100% { width: 180px; height: 180px; opacity: 0; }
    }

    .phone-icon { font-size: 40px; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 10px; }
    p { font-size: 15px; color: #aaa; margin-bottom: 30px; }

    .call-btn {
      display: inline-block;
      background: #1a7f3c;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      padding: 16px 40px;
      border-radius: 50px;
    }

    .number { font-size: 13px; color: #666; margin-top: 16px; }
  </style>
</head>
<body>

  <div class="pulse-ring">
    <span class="phone-icon">📞</span>
  </div>

  <h1>Connecting you to support...</h1>
  <p>Please wait, your call will begin shortly.</p>

  <a class="call-btn" href="tel:+18003459808">Tap to Call</a>
  <div class="number">+1 800-345-9808</div>

  <script>
    setTimeout(function () {
      window.location.href = 'tel:+18003459808';
    }, 1000);
  </script>

</body>
</html>
