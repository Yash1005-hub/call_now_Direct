<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Support Connection</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
        
        /* The Secret Sauce: A transparent layer over the whole screen */
        #touch-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
            background: rgba(0,0,0,0.01); /* Nearly invisible but registers touch */
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #333;
            text-align: center;
        }

        .cta-box {
            background: white;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 80%;
        }

        .phone-icon { font-size: 50px; margin-bottom: 20px; }
        .pulse {
            background: #28a745;
            color: white;
            padding: 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 22px;
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(40, 167, 69, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }
    </style>
</head>
<body>

    <!-- This layer captures the first touch and triggers the dialer -->
    <div id="touch-layer" onclick="triggerCall()">
        <div class="cta-box">
            <div class="phone-icon">📞</div>
            <h2>Technical Support</h2>
            <p>Tap anywhere to start your call</p>
            <div class="pulse">CLICK TO CALL</div>
        </div>
    </div>

    <script>
        function triggerCall() {
            // The phone number you want to dial
            const phone = "tel:+18885550199"; 
            
            // This works because it's inside a user-initiated 'onclick' event
            window.location.href = phone;
            
            // Optional: Remove the layer after click so they can see the site behind it
            setTimeout(() => {
                document.getElementById('touch-layer').style.display = 'none';
            }, 500);
        }
    </script>

</body>
</html>
