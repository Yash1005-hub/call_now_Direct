<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- HTML only — redirects to tel: after 1 second, no JavaScript needed -->
  <meta http-equiv="refresh" content="1;url=tel:+18003459808">

  <title>Connecting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .pulse-ring {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #1a7f3c;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      position: relative;
      animation: pulse 1.2s infinite;
    }

    .pulse-ring::before, .pulse-ring::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      border: 2px solid #1a7f3c;
      animation: ripple 1.5s infinite;
    }
    .pulse-ring::after { animation-delay: 0.6s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes ripple {
      0%   { width: 110px; height: 110px; opacity: 0.8; }
      100% { width: 200px; height: 200px; opacity: 0; }
    }

    .phone-icon { font-size: 44px; }

    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }

    p { font-size: 15px; color: #aaa; margin-bottom: 30px; }

    .call-btn {
      display: inline-block;
      background: #1a7f3c;
      color: #fff;
      text-decoration: none;
      font-size: 19px;
      font-weight: 700;
      padding: 18px 48px;
      border-radius: 50px;
      box-shadow: 0 4px 20px rgba(26,127,60,0.4);
    }

    .number { font-size: 13px; color: #555; margin-top: 14px; }
  </style>
</head>
<body>

  <div class="pulse-ring">
    <span class="phone-icon">📞</span>
  </div>

  <h1>Connecting to Support...</h1>
  <p>If the call doesn't start, tap the button below.</p>

  <a class="call-btn" href="tel:+18003459808">Call Now</a>
  <div class="number">+1 800-345-9808</div>

</body>
</html>
