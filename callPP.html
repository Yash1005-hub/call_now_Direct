<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Support</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; width: 100%; }

    .full-page-call {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 100vh;
      width: 100%;
      background: #0a0a0a;
      color: #fff;
      text-decoration: none;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .pulse-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #1a7f3c;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      position: relative;
      animation: pulse 1.2s infinite;
    }

    .pulse-ring::before, .pulse-ring::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      border: 3px solid #1a7f3c;
      animation: ripple 1.8s infinite;
    }
    .pulse-ring::after { animation-delay: 0.9s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(26,127,60,0.5); }
      50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(26,127,60,0); }
    }

    @keyframes ripple {
      0%   { width: 130px; height: 130px; opacity: 0.6; }
      100% { width: 260px; height: 260px; opacity: 0; }
    }

    .phone-icon { font-size: 52px; }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #fff;
    }

    .subtitle {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 10px;
    }

    .tap-hint {
      font-size: 14px;
      color: #1a7f3c;
      font-weight: 600;
      margin-bottom: 40px;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* Call box with image + number side by side */
    .call-box {
      background: #1a7f3c;
      border-radius: 20px;
      padding: 20px 36px;
      box-shadow: 0 6px 30px rgba(26,127,60,0.5);
      display: flex;
      align-items: center;
      gap: 18px;
    }

    /* Image auto-sized to match the dialer icon (52px) */
    .call-box img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .call-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .call-box .label {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .call-box .number {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }

    .footer-note {
      position: fixed;
      bottom: 20px;
      font-size: 12px;
      color: #333;
    }
  </style>
</head>
<body>

  <a class="full-page-call" href="tel:+18775136221">

    <div class="pulse-ring">
      <span class="phone-icon">📞</span>
    </div>

    <h1>Talk to Support Now</h1>
    <p class="subtitle">Free consultation — no hold time</p>
    <p class="tap-hint">👆 TAP ANYWHERE TO CALL</p>

    <div class="call-box">
      <!-- Place 223.png in the same folder as this HTML file -->
      <img src="223.png" alt="Logo">
      <div class="call-info">
        <div class="label">Toll Free</div>
        <div class="number">+1 (877) 513-6221</div>
      </div>
    </div>

  </a>

  <div class="footer-note">Tap anywhere on this page to connect</div>

</body>
</html>
